# Tests and builds the app on every pull request. On a push to main it also deploys to GitHub Pages.
name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: No em or en dashes in app text
        env:
          LC_ALL: C.UTF-8
        run: |
          if grep -rnP '\x{2014}|\x{2013}' src scripts index.html public docs AGENTS.md State.md .github; then
            echo "Found an em or en dash. Rewrite with a colon, a comma or two sentences."; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # Opens every source link in the lesson front matter. Pull requests only, and never part of the deploy: a
  # publisher outage must not block a release. It fails on a 404 or 410; blocked or timed-out links are listed apart.
  links:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Source links open
        run: npm run links

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
